[package]
name = "ats-ranker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
duckdb = { version = "1.10504.0", features = ["bundled"] }
html2text = "0.17.1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
