[package]
name = "ats-ranker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
dotenvy = "0.15.7"
# duckdb = { version = "1.10504.0", features = ["bundled"] }
duckdb = { version = "1", features = ["chrono", "json"] }
html2text = "0.17.1"
hex = "0.4"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
sha2 = "0.11.0"
regex = "1.13.1"
